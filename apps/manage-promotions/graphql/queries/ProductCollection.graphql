query ProductCollection($filter: ProductFilterInput, $first: Int = 100, $after: String) {
  products(first: $first, after: $after, channel: "default-channel", filter: $filter) {
    edges {
      node {
        id
      }    
    }
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
  }
}
