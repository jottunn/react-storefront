query CollectionsByMetaKey($filter: CollectionFilterInput, $channel: String!, $first: Int = 100) {
  collections(first:$first, filter: $filter, channel: $channel) {
    edges {
        node {
            id
            name
            metadata {
              key
              value
            }
            privateMetadata {
                key
                value
            }
        }
    }
  }
}
