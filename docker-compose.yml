      - "traefik.http.routers.products-importer.entrypoints=websecure"
      - "traefik.http.routers.products-importer.tls=true"
      - "traefik.http.routers.products-importer.tls.certresolver=cloudflare"
      - "traefik.http.services.products-importer.loadbalancer.server.port=3004"
      - "traefik.http.routers.products-importer.middlewares=cloudflare-headers"
    networks:
